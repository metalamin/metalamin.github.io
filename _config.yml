remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "dark"
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# Site Settings
locale                   : "es"
title                    : "Metalamin Site"
title_separator          : "-"
name                     : &name "Metalamin"
description              : &description "Ze amazing website."
url                      : "https://metalamin.github.io"
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "metalamin/metalamin.github.io"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
search                   : true

# Social Sharing
twitter:
  username: &twitter "metalamin"
  
# Site Author  
author:
  name   : "Your Name"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "My awesome biography constrained to a sentence or two goes here."
  email  : # optional
  uri    : "https://metalamin.github.io"
  home   :
  github : "metalamin"
  twitter: *twitter

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      
paginate: 5 # amount of posts to show
paginate_path: /page:num/


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: America/New_York # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
